# ===================================================================
# LabelCheck Test Configuration - Isolated In-Memory H2 Database
# ===================================================================

spring.application.name=labelcheck-backend-test

# Temporary Test Upload Directory
app.upload.dir=target/test-uploads

# In-Memory H2 Database for Automated Testing
spring.datasource.url=jdbc:h2:mem:labelcheck-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tesseract Settings in Test
app.ocr.enabled=true
app.ocr.tesseract.datapath=tessdata
app.ocr.tesseract.language=eng
