# ===================================================================
# LabelCheck Backend Configuration (SIH26034)
# ===================================================================

# Application Identity
spring.application.name=labelcheck-backend

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Servlet Multipart Configuration (Max 10MB per label image)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Temporary Image Upload Directory
app.upload.dir=uploads

# Tesseract OCR Configuration (Fallback / Evidence)
app.ocr.enabled=${APP_OCR_ENABLED:true}
app.ocr.tesseract.datapath=${TESSERACT_DATA_PATH:tessdata}
app.ocr.tesseract.language=${TESSERACT_LANGUAGE:eng}

# Vision AI Configuration (Primary: Google Gemini Flash Vision, Fallback: Groq Vision)
app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.groq-api-key=${GROQ_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.groq-base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.model=${AI_MODEL:gemini-3.1-flash-lite}
app.ai.gemini-model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.groq-model=${GROQ_MODEL:qwen/qwen3.6-27b}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
app.ai.max-retries=${AI_MAX_RETRIES:2}
app.ai.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:4000}
app.ai.reasoning-effort=${AI_REASONING_EFFORT:low}
app.ai.thinking-budget=${AI_THINKING_BUDGET:0}
app.ai.temperature=${AI_TEMPERATURE:0.1}

# H2 Database Configuration (File-based local storage surviving restarts)
spring.datasource.url=jdbc:h2:file:./data/labelcheck;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled for production/security)
spring.h2.console.enabled=false

labelcheck.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*

# Standard Logging Configuration
logging.level.root=INFO
logging.level.com.labelcheck=INFO
logging.level.org.springframework.web=INFO
